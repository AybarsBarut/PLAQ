name: Bug report
description: Report a reproducible codec, parser, CLI, or transport defect.
title: "[bug] "
labels: [bug]
body:
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction
      description: Include the command, PLAQ version, platform, and synthetic input properties. Do not upload copyrighted audio.
    validations:
      required: true
  - type: textarea
    id: output
    attributes:
      label: Relevant output
      render: shell

