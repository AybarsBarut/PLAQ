name: Experiment proposal
description: Propose a falsifiable predictor, entropy, or transport experiment.
title: "[experiment] "
labels: [experiment]
body:
  - type: textarea
    id: hypothesis
    attributes:
      label: Hypothesis
      description: State the expected measurable effect and why it might occur.
    validations:
      required: true
  - type: textarea
    id: method
    attributes:
      label: Method and controls
      description: Define the corpus, baselines, metrics, and acceptance criteria.
    validations:
      required: true

